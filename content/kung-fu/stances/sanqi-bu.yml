description: |
  Called 3-7-stance (3 = 三 and 7 = 七), because of its weight distribution.
  30% of weight is on the front leg and 70% on the back leg.

  Used in Tai Chi all the time.

  The video starts in <ref>/kung-fu/stances/ma-bu</ref> and then switches to sānqī bù while switching from one leg to the other.
