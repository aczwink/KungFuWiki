description: |
  Called 4-6-stance (4 = 四 and 6 = 六), because of its weight distribution.
  40% of weight is on the front leg and 60% on the back leg.

  Also called "半碼步", i.e., "half 碼步", because the back leg is like in <ref>/kung-fu/stances/ma-bu</ref> but the front foot is pointing forward instead.
